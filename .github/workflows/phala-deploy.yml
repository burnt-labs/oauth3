# oauth3's only Phala path: the organization's one Phala flow
# (burnt-labs/github-workflows phala-deploy.yml), driven by .github/phala-policy.jsonc.
# release = oauth3-redacted (oauth3.burnt.com). There is no candidate CVM yet.
#   setup:  create the absent CVM, once.
#   update: deploy image-digest to the existing CVM (new compose hash).
#   reseal: re-apply the CVM's sealed environment and restart it; no image change.
# image-digest is the sha256 digest docker-build.yml promoted (update and setup).
# Do not add a repository-local deploy path; extend the shared flow (AGENTS.md).
name: Phala Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Semantic target
        required: true
        type: choice
        options: [release]
      operation:
        description: Operation
        required: true
        type: choice
        options: [update, reseal, setup]
      image-digest:
        description: Image digest to deploy (sha256:<64 hex>); empty for reseal
        required: false
        type: string

permissions:
  contents: read
  deployments: write
  packages: write

jobs:
  phala:
    uses: burnt-labs/github-workflows/.github/workflows/phala-deploy.yml@8c26ba4346e518370b37f4a79be7a5d1e828f4e2 # unreleased
    with:
      target: ${{ inputs.target }}
      operation: ${{ inputs.operation }}
      image-digest: ${{ inputs.image-digest }}
    secrets: inherit
